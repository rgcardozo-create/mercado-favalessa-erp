<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mercado Favalessa ERP</title>
  <meta name="theme-color" content="#123C8B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icone-192.png" />
  <link rel="icon" href="assets/icons/icone-192.png" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="assets/js/app.js"></script>
  <script>
    // Service worker só faz sentido servido por HTTP(S); em file:// é ignorado.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
